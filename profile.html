<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Nombre de jugador · RPG CLICKER</title>
  <style>
    body{box-sizing:border-box;min-height:100dvh;max-width:520px;margin:auto;padding:32px 20px;background:#08080d;color:#eee0c4;font:17px/1.5 Georgia,serif}
    h1{color:#edbf69;font-size:30px}p{color:#c8b996}label{display:block;margin:20px 0 8px}input{box-sizing:border-box;width:100%;min-height:52px;padding:10px;border:2px solid #b99450;background:#000;color:#fff;font:22px Georgia,serif}
    button{min-height:50px;margin-top:18px;padding:9px 20px;border:2px solid #b99450;background:#171420;color:#f6deb0;font:17px Georgia,serif;cursor:pointer}
    button:disabled{opacity:.5}a{color:#edbf69}#status{min-height:28px}nav{margin-top:28px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
</head>
<body>
  <h1>Nombre de jugador</h1>
  <p>Tu cuenta Google guarda la partida. Puedes elegir otro nombre para mostrarlo en RPG CLICKER y en la clasificación.</p>
  <form id="profile-form" hidden>
    <label for="player-name">Nombre visible, de 2 a 12 caracteres</label>
    <input id="player-name" maxlength="12" minlength="2" autocomplete="nickname" required>
    <button id="save" type="submit">Guardar nombre</button>
  </form>
  <p id="status" role="status">Comprobando sesión…</p>
  <nav><a href="index.html">Volver al juego</a> · <a href="privacy.html">Privacidad</a></nav>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const form = document.getElementById('profile-form');
      const input = document.getElementById('player-name');
      const save = document.getElementById('save');
      if (location.protocol !== 'https:' && !['127.0.0.1','localhost'].includes(location.hostname)) { status.textContent = 'El acceso seguro estará disponible en unos minutos.'; return; }
      const client = supabase.createClient('https://mrmvmoyysxuopqexbxfk.supabase.co', 'sb_publishable_tZEPJi2v7Tp-xDuVa0qWRw_geizIGoD');
      const {data:{session},error:sessionError} = await client.auth.getSession();
      if (sessionError || !session?.user) { status.textContent = 'Inicia sesión desde el juego y vuelve aquí para cambiar el nombre.'; return; }
      const user = session.user;
      const {data:player,error:loadError} = await client.from('rpg_clicker_players').select('display_name,game_data,killed_enemies,enemy_level,player_gold').eq('user_id',user.id).maybeSingle();
      if (loadError) { status.textContent = 'No se pudo cargar tu perfil. Comprueba la conexión.'; return; }
      input.value = player?.display_name || String(user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || 'Jugador').trim().split(/[\s(]/)[0].slice(0,12);
      form.hidden = false;
      status.textContent = '';
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const name = input.value.trim().replace(/\s+/g,' ');
        if (!/^[\p{L}\p{N} _-]{2,12}$/u.test(name)) { status.textContent = 'Usa entre 2 y 12 letras, números, espacios, _ o -.'; return; }
        save.disabled = true;
        status.textContent = 'Guardando…';
        const {data:other,error:checkError} = await client.from('rpg_clicker_scores').select('user_id').ilike('display_name',name).neq('user_id',user.id).limit(1);
        if (checkError) { status.textContent = 'No se pudo comprobar el nombre. Inténtalo de nuevo.'; save.disabled = false; return; }
        if (other?.length) { status.textContent = 'Ese nombre ya está en uso. Elige otro.'; save.disabled = false; return; }
        const gameData = {...(player?.game_data || {}),PlayerUsername:name};
        const updated_at = new Date().toISOString();
        const killed_enemies = player?.killed_enemies || 0;
        const enemy_level = player?.enemy_level || 1;
        const [{error:playerError},{error:scoreError}] = await Promise.all([
          client.from('rpg_clicker_players').upsert({user_id:user.id,display_name:name,killed_enemies,enemy_level,player_gold:player?.player_gold || 0,game_data:gameData,updated_at}),
          client.from('rpg_clicker_scores').upsert({user_id:user.id,display_name:name,killed_enemies,enemy_level,updated_at})
        ]);
        if (playerError || scoreError) { status.textContent = 'No se pudo guardar. Comprueba la conexión.'; save.disabled = false; return; }
        status.textContent = 'Nombre guardado. Vuelve al juego para verlo.';
        save.disabled = false;
      });
    })();
  </script>
</body>
</html>
